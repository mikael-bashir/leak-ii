server {
    listen 7860;

    location / {
        # 1. ALWAYS attach these CORS headers to every response
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # 2. Intercept the browser's invisible "preflight" check and approve it instantly
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 3. Your existing proxy handoff to the Lean server
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host localhost;

        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Forwarded-Server localhost;
        
        # 4. Required settings for SSE and HTTP Streaming
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}