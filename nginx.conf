worker_processes 1;
daemon off; # Run in foreground so Docker stays alive
error_log /tmp/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Move all Nginx temp writes to /tmp to avoid Permission Denied
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log /tmp/access.log;

    server {
        # Listen on the public port Hugging Face expects
        listen 7860;
        
        location / {
            # Route traffic down to our hidden Python server
            proxy_pass http://127.0.0.1:8000;
            
            # --- THE MAGIC TRANSLATION ---
            # Tell Python it is secure so it doesn't drop the Session ID!
            proxy_set_header Host $http_x_proxied_host;
            proxy_set_header X-Forwarded-Host $http_x_proxied_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;

            # --- CRITICAL FOR STREAMABLE-HTTP ---
            # Keep the streaming pipeline wide open
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
    }
}